name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Harus sama persis dengan nama yang dibaca src/api/client.ts.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Package build
        run: tar -czf frontend.tar.gz -C dist .

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "$VPS_PORT" \
            frontend.tar.gz \
            "$VPS_USER@$VPS_HOST:/home/deploy/releases/frontend/"

      - name: Activate frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
              set -e

              ARCHIVE="/home/deploy/releases/frontend/frontend.tar.gz"
              TEMP_DIR="/home/deploy/releases/frontend/current"
              WEB_DIR="/var/www/calon-mantoe.cloud/frontend"

              rm -rf "$TEMP_DIR"
              mkdir -p "$TEMP_DIR"
              tar -xzf "$ARCHIVE" -C "$TEMP_DIR"

              rm -rf "$WEB_DIR"/*
              cp -a "$TEMP_DIR"/. "$WEB_DIR"/

              rm -rf "$TEMP_DIR"
              rm -f "$ARCHIVE"

              echo "Frontend berhasil di-deploy."
          EOF